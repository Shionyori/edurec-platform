server:
  port: 8080
  mode: debug

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: root
  database: edurec
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  access_secret: "change-me-in-production"
  refresh_secret: "change-me-in-production-too"
  access_expire: 15
  refresh_expire: 10080

engine:
  # 推荐结果文件：engine 侧生成后【手动拷贝】到这里（见 docs/data-handoff.md）
  recommendations_file: "data/recommendations.json"
  # 演示/模拟数据集：engine 侧 dataset/sim【手动拷贝】到这里（demo_seed 播种用）
  dataset_dir: "data/sim"
  # 数据快照导出目录（export_snapshot 输出，平台本地；再手动拷给 engine 训练）
  snapshot_dir: "data/snapshots"

bilibili:
  # 在线搜索/评论实时爬取（后端 os/exec 调 backend/crawler/online.py）
  python_path: "python"
  crawler_dir: "crawler"
  category: "B站视频"
  search_limit: 10
  # 无限滚动时最多翻多少页 B 站结果，防无界爬取
  search_max_pages: 5
  comment_limit: 20